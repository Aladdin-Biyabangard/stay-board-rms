name: Build and Deploy RMS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. v1.0.0.9)"
        required: true
        type: string

env:
  DOCKER_REPO: ingressgroup
  COMPOSE_FILE: docker-compose.prod.yml
  COMPOSE_SERVICE: rms

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with 'v' (got: $TAG)" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Configure Docker Hub credentials
        run: |
          {
            echo "dockerHubUsername=${{ secrets.DOCKERHUB_USERNAME }}"
            echo "dockerHubPassword=${{ secrets.DOCKERHUB_TOKEN }}"
            echo "dockerRepoUrl=${{ env.DOCKER_REPO }}"
          } >> gradle.properties

      - name: Build and push Docker image
        run: |
          chmod +x scripts/build-and-push.sh
          ./scripts/build-and-push.sh \
            -Command stay-board-rms-build-push \
            -Tag "${{ steps.meta.outputs.tag }}"

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: scripts/deploy-on-server.sh
          target: /tmp/stay-board-rms-deploy

      - name: Deploy RMS on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKER_REPO: ${{ env.DOCKER_REPO }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          COMPOSE_SERVICE: ${{ env.COMPOSE_SERVICE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: TAG,DEPLOY_PATH,DOCKER_REPO,COMPOSE_FILE,COMPOSE_SERVICE
          script_stop: true
          command_timeout: 10m
          script: |
            chmod +x /tmp/stay-board-rms-deploy/scripts/deploy-on-server.sh
            /tmp/stay-board-rms-deploy/scripts/deploy-on-server.sh
