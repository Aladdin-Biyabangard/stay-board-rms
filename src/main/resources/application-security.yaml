security:
  jwtProperties:
    secret: ${APP_SECRET_KEY:}
    token-validity-in-seconds: 1800
    refresh-token-validity-in-days: 7          # 7 days
    password-reset-expiration-in-minutes: 15
  cors:
    allowed-origins: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count'
    allow-credentials: true
    max-age: 1800
